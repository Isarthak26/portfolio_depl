<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="optBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" fill="url(#optBg)" rx="16"/>

  <!-- TITLE BAR -->
  <text x="50" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">CloudOpt AI Architecture</text>
  <text x="50" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Empirical Resource Measurement, k6 Load Profiling & Compute Optimization</text>

  <!-- BOX 1: Workload & k6 Runner -->
  <rect x="50" y="100" width="260" height="270" rx="14" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="70" y="120" width="100" height="26" rx="6" fill="#8B5CF6"/>
  <text x="120" y="137" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STAGED LOAD</text>
  <text x="70" y="175" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">k6 Load Generator</text>
  <text x="70" y="195" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Ramping VUs (0 → 500 req/s)</text>

  <rect x="70" y="220" width="220" height="60" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="85" y="245" fill="#E2E8F0" font-family="monospace" font-size="11">Target: FastAPI Service</text>
  <text x="85" y="265" fill="#38BDF8" font-family="monospace" font-size="10">Python 3.12 + PostgreSQL</text>

  <rect x="70" y="295" width="220" height="50" rx="8" fill="#6366F1" opacity="0.15"/>
  <text x="180" y="325" text-anchor="middle" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Docker Compose Isolation</text>

  <!-- ARROW 1 -->
  <path d="M 310 235 L 370 235" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">telemetry</text>

  <!-- BOX 2: Telemetry & Observability -->
  <rect x="370" y="100" width="260" height="270" rx="14" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
  <rect x="390" y="120" width="120" height="26" rx="6" fill="#0284C7"/>
  <text x="450" y="137" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">OBSERVABILITY</text>
  <text x="390" y="175" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Prometheus & Grafana</text>
  <text x="390" y="195" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Real-time Container Metrics</text>

  <rect x="390" y="220" width="220" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="405" y="245" fill="#34D399" font-family="system-ui, sans-serif" font-size="11">CPU & Memory Utilization</text>

  <rect x="390" y="270" width="220" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="405" y="295" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11">p95 / p99 Latency Logs</text>

  <rect x="390" y="320" width="220" height="35" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="405" y="342" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Automated Python Log Parsers</text>

  <!-- ARROW 2 -->
  <path d="M 630 235 L 690 235" stroke="#CBD5E1" stroke-width="2"/>
  <text x="660" y="225" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">analysis</text>

  <!-- BOX 3: Optimization Dashboard -->
  <rect x="690" y="100" width="260" height="270" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <rect x="710" y="120" width="130" height="26" rx="6" fill="#10B981"/>
  <text x="775" y="137" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RECOMMENDER</text>
  <text x="710" y="175" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">React (Vite + Recharts)</text>
  <text x="710" y="195" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Dynamic Sizing Advisor</text>

  <rect x="710" y="220" width="220" height="55" rx="8" fill="#0F172A" stroke="#10B981" stroke-dasharray="3,3"/>
  <text x="725" y="242" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Baseline vs Recommended</text>
  <text x="725" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Threshold Optimization Rules</text>

  <rect x="710" y="285" width="220" height="60" rx="8" fill="#10B981" opacity="0.15"/>
  <text x="725" y="310" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Estimated 30-45% Savings</text>
  <text x="725" y="330" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Without SLA Compromise</text>
</svg>
